# AI Recruiter — local infrastructure
#
# Nothing is installed on the host: the API, PostgreSQL and Redis all run in
# containers and keep their data in named volumes.
#
#   docker compose up -d backend  the API and the database it depends on
#   docker compose up -d          also start Redis and Adminer
#   docker compose ps             check health
#   docker compose down           stop (data survives)
#   docker compose down -v        stop and delete the data volumes
#
# Postgres is the store as of Phase 3 — the API migrates itself on start, so an
# empty volume needs no extra step. Redis is still unused: Phase 7 moves jobs onto
# it. Adminer is a browser SQL client, so no database GUI is needed on the host.
#
# Nothing here calls out to the internet unless `.env` carries a provider key:
# with BRAVE_SEARCH_API_KEY set, searches query the live web (Phase 4); with
# SCRAPEGRAPH_API_KEY set as well, the pages they find are opened and read
# (Phase 5). Without either, everything runs over the seeded catalogue.

name: ai-recruiter

services:
  postgres:
    image: postgres:17-alpine
    container_name: air-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airecruiter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airecruiter}
      POSTGRES_DB: ${POSTGRES_DB:-airecruiter}
      # Deterministic collation so ORDER BY on names behaves the same everywhere.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airecruiter} -d ${POSTGRES_DB:-airecruiter}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: air-redis
    restart: unless-stopped
    # appendonly keeps queued jobs across a restart.
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Browser-based SQL client, so no database GUI is needed on the host.
  adminer:
    image: adminer:5
    container_name: air-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    ports:
      - "${ADMINER_PORT:-8081}:8080"

  # ------------------------------------------------------------------ the API
  # `docker compose up -d backend` starts postgres too and waits for it to be
  # healthy, then the API migrates the schema and seeds an empty database once.
  backend:
    build: ./backend
    container_name: air-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Compose-only values; everything else comes from .env (spec §22). The .env
      # DATABASE_URL is host-side (localhost), so inside the network it is replaced
      # by the service name.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-airecruiter}:${POSTGRES_PASSWORD:-airecruiter}@postgres:5432/${POSTGRES_DB:-airecruiter}
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Edit on the host, reload in the container.
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
      # pytest, ruff and alembic read their configuration from here.
      - ./backend/pyproject.toml:/app/pyproject.toml:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # ---------------------------------------------------------------- Phase 7+
  # Workers are stateless, so scaling is `docker compose up -d --scale worker=10`
  # (spec §42). Enabled once jobs move from asyncio to Celery.
  #
  # worker:
  #   build: ./backend
  #   env_file:
  #     - path: .env
  #       required: false
  #   depends_on:
  #     redis: { condition: service_healthy }
  #   command: celery -A app.workers.celery_app worker --concurrency=4 -l info
  #   deploy:
  #     replicas: 3

volumes:
  postgres-data:
  redis-data:
