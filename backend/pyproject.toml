[project]
name = "ai-recruiter-backend"
version = "0.2.0"
description = "AI Recruiter API — FastAPI backend (Phase 2 skeleton)"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Typographic dashes and § are deliberate: comments cite spec sections verbatim,
# and the seeded fixtures are multilingual.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Migrations are generated: `op.create_table(...)` lines are left as Alembic wrote
# them, so a future autogenerate produces a clean diff instead of reformatting.
"alembic/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
# There is an `alembic/` directory in this project, but `import alembic` is the
# tool, not local code.
known-third-party = ["alembic"]
