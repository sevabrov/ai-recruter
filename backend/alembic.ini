# Alembic configuration.
#
# The database URL deliberately stays empty here: it belongs to the environment
# (spec §22), so `alembic/env.py` reads it from app.core.config unless a caller
# passes one in. Everything works the same from the CLI and from the API's
# startup hook:
#
#   docker compose run --rm backend alembic revision --autogenerate -m "..."
#   docker compose run --rm backend alembic upgrade head
#   docker compose run --rm backend alembic downgrade -1
#   docker compose run --rm backend alembic current

[alembic]
script_location = alembic
prepend_sys_path = .
# Migration files are named 0001_… , 0002_… so the directory reads in order.
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url =
